<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulačka záhradných domčekov</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F6F5F0;
    --surface: #FFFFFF;
    --surface-2: #EFEDE4;
    --ink: #202B21;
    --muted: #6A7263;
    --line: #E2E0D5;
    --accent: #2F6B45;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4EEE6;
    --timber: #A9741F;
    --timber-soft: #F4EAD6;
    --danger: #A33B2E;
    --danger-soft: #F6E4E1;
    --shadow: 0 1px 2px rgba(32, 43, 33, 0.06), 0 4px 14px rgba(32, 43, 33, 0.05);
    --radius: 10px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161B16;
      --surface: #1E241E;
      --surface-2: #242B24;
      --ink: #E7E5DA;
      --muted: #9AA491;
      --line: #313A31;
      --accent: #74B086;
      --accent-ink: #12190E;
      --accent-soft: #23372A;
      --timber: #D9A24B;
      --timber-soft: #38301C;
      --danger: #D4796B;
      --danger-soft: #3C2622;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F6F5F0; --surface: #FFFFFF; --surface-2: #EFEDE4; --ink: #202B21;
    --muted: #6A7263; --line: #E2E0D5; --accent: #2F6B45; --accent-ink: #FFFFFF;
    --accent-soft: #E4EEE6; --timber: #A9741F; --timber-soft: #F4EAD6;
    --danger: #A33B2E; --danger-soft: #F6E4E1;
    --shadow: 0 1px 2px rgba(32, 43, 33, 0.06), 0 4px 14px rgba(32, 43, 33, 0.05);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161B16; --surface: #1E241E; --surface-2: #242B24; --ink: #E7E5DA;
    --muted: #9AA491; --line: #313A31; --accent: #74B086; --accent-ink: #12190E;
    --accent-soft: #23372A; --timber: #D9A24B; --timber-soft: #38301C;
    --danger: #D4796B; --danger-soft: #3C2622;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 14px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
  }

  /* ---------- hlavička + záložky ---------- */
  header.app {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 18px 22px 0;
  }
  header.app h1 {
    font-family: var(--serif);
    font-size: 24px; font-weight: 600; margin: 0;
    letter-spacing: 0.01em;
  }
  header.app .sub { color: var(--muted); font-size: 13px; }
  nav.tabs {
    display: flex; gap: 4px; padding: 12px 22px 0; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  nav.tabs button {
    appearance: none; border: 1px solid var(--line); border-bottom: none;
    background: var(--surface-2); color: var(--ink);
    font: inherit; padding: 8px 16px; cursor: pointer;
    border-radius: 8px 8px 0 0; position: relative; top: 1px;
  }
  nav.tabs button[aria-selected="true"] {
    background: var(--surface); font-weight: 600;
    border-bottom: 1px solid var(--surface);
  }
  nav.tabs button:focus-visible,
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  main { padding: 18px 22px 60px; }

  /* ---------- všeobecné prvky ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px;
  }
  .label {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
  }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field .hint { font-size: 12px; color: var(--muted); }
  input[type="number"], input[type="text"], input[type="email"], input[type="tel"], select, textarea {
    font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; width: 100%;
  }
  input[type="number"], input[inputmode="decimal"] { font-variant-numeric: tabular-nums; text-align: right; }
  .check { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  button.btn {
    appearance: none; font: inherit; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--ink);
    padding: 8px 14px;
  }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  table.data {
    width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums;
  }
  table.data th, table.data td {
    padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  table.data th {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  table.data th:first-child, table.data td:first-child { text-align: left; white-space: normal; }
  table.data tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
  .scroll-x { overflow-x: auto; }
  .note { font-size: 12px; color: var(--muted); }
  .pill {
    display: inline-block; font-size: 11px; font-weight: 600;
    border-radius: 99px; padding: 2px 9px;
    background: var(--accent-soft); color: var(--accent);
  }
  .pill.warn { background: var(--danger-soft); color: var(--danger); }

  /* ---------- kalkulácia: rozloženie ---------- */
  .kalk-grid {
    display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px;
    align-items: start;
  }
  @media (max-width: 900px) { .kalk-grid { grid-template-columns: 1fr; } }
  .sidebar {
    display: flex; flex-direction: column; gap: 14px; position: sticky; top: 12px;
    max-height: calc(100vh - 24px); overflow-y: auto;
  }
  @media (max-width: 900px) { .sidebar { position: static; max-height: none; overflow: visible; } }
  .sidebar .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .results { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  .hero { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start; }
  @media (max-width: 700px) { .hero { grid-template-columns: 1fr; } }
  .hero h2 { font-family: var(--serif); font-size: 19px; margin: 0 0 4px; font-weight: 600; }
  .price-big { text-align: right; }
  .price-big .novat { font-size: 15px; color: var(--muted); }
  .price-big .withvat {
    font-size: 30px; font-weight: 700; color: var(--timber);
    font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .price-big .caption { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .breakdown {
    display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px;
    font-variant-numeric: tabular-nums; font-size: 13px;
  }
  .breakdown .item b { font-weight: 600; }
  .breakdown .item span { color: var(--muted); }

  tr.selected td { background: var(--accent-soft); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--surface-2); }
  tr.selected.clickable:hover td { background: var(--accent-soft); }
  tr.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  details.bom { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  details.bom + details.bom { margin-top: 10px; }
  details.bom summary {
    cursor: pointer; padding: 10px 14px; font-weight: 600;
    display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    font-variant-numeric: tabular-nums;
  }
  details.bom summary .sum { color: var(--muted); font-weight: 500; }
  details.bom .inner { padding: 0 14px 12px; }

  h3.section {
    font-family: var(--serif); font-size: 16px; font-weight: 600;
    margin: 0 0 10px;
  }
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .settings-block { display: flex; flex-direction: column; gap: 10px; }

  /* ---------- cenník ---------- */
  #tab-cennik input[data-field="price"] { width: 110px; }
  #tab-cennik input[data-field="supplier"] { width: 140px; }
  #tab-cennik td.center, #tab-cennik th.center { text-align: center; }

  /* ---------- ponuka ---------- */
  .ponuka-grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .ponuka-grid { grid-template-columns: 1fr; } }
  .quote-doc {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 32px; max-width: 760px;
  }
  .quote-doc .qhead { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 12px; }
  .quote-doc .qhead .firm { font-size: 13px; }
  .quote-doc .qhead .firm b { font-size: 15px; }
  .quote-doc h2 { font-family: var(--serif); font-size: 22px; margin: 0; font-weight: 700; }
  .quote-doc .qmeta { font-size: 12px; color: var(--muted); text-align: right; }
  .quote-doc .qsection { margin-top: 18px; }
  .quote-doc .qsection > .label { margin-bottom: 6px; }
  .quote-doc table.data td, .quote-doc table.data th { white-space: normal; }
  .quote-doc .qfoot { margin-top: 22px; font-size: 12px; color: var(--muted); }

  /* ---------- tlač ---------- */
  @media print {
    /* tlač je vždy na bielom — vynúť svetlé tokeny aj pri tmavej téme */
    :root, :root[data-theme="dark"], :root[data-theme="light"] {
      --bg: #fff; --surface: #fff; --surface-2: #fff; --ink: #111;
      --muted: #555; --line: #bbb; --accent: #2F6B45; --accent-ink: #fff;
      --accent-soft: #fff; --timber: #7a5210; --timber-soft: #fff;
      --danger: #A33B2E; --danger-soft: #fff; --shadow: none;
    }
    body { background: #fff; color: #111; font-size: 12px; }
    header.app, nav.tabs, .no-print { display: none !important; }
    main { padding: 0; }
    .ponuka-grid { display: block; }
    .ponuka-form { display: none; }
    .quote-doc { border: none; box-shadow: none; padding: 0; max-width: none; }
    .quote-doc .qhead { border-color: #111; }
    table.data th, table.data td { border-color: #bbb; }
  }
  @media (prefers-reduced-motion: no-preference) {
    nav.tabs button, button.btn { transition: background 120ms ease; }
  }
</style>
</head>
<body>
  <header class="app">
    <h1>Kalkulačka záhradných domčekov</h1>
    <span class="sub">ceny bez DPH sú základ výpočtu · predaj s DPH = predajná cena × (1 + DPH)</span>
  </header>
  <nav class="tabs" role="tablist" aria-label="Sekcie kalkulačky">
    <button id="tabbtn-kalk" role="tab" data-tab="kalk" aria-selected="true" aria-controls="tab-kalk">Kalkulácia</button>
    <button id="tabbtn-cennik" role="tab" data-tab="cennik" aria-selected="false" aria-controls="tab-cennik">Cenník materiálov</button>
    <button id="tabbtn-nastavenia" role="tab" data-tab="nastavenia" aria-selected="false" aria-controls="tab-nastavenia">Nastavenia</button>
    <button id="tabbtn-ponuka" role="tab" data-tab="ponuka" aria-selected="false" aria-controls="tab-ponuka">Cenová ponuka</button>
  </nav>
  <main>
    <section id="tab-kalk" role="tabpanel" aria-labelledby="tabbtn-kalk" tabindex="-1"></section>
    <section id="tab-cennik" role="tabpanel" aria-labelledby="tabbtn-cennik" tabindex="-1" hidden></section>
    <section id="tab-nastavenia" role="tabpanel" aria-labelledby="tabbtn-nastavenia" tabindex="-1" hidden></section>
    <section id="tab-ponuka" role="tabpanel" aria-labelledby="tabbtn-ponuka" tabindex="-1" hidden></section>
  </main>
  <script>
/*
 * Výpočtové jadro kalkulačky záhradných domčekov.
 *
 * Verná replika logiky z KALKULACKA_FINAL.xlsx — smerodajná je spodná sekcia
 * „bez DPH" na hárku `kalkulacka` (riadky 44–51):
 *   predajná cena BEZ DPH = (materiál×maržaMat + výroba + doprava + montáž + príplatok) × finálnyKoef
 *   predaj s DPH          = predajná cena BEZ DPH × (1 + DPH)
 *
 * Množstvá materiálu sa počítajú podľa hárkov domček / terasa / podlaha v domceku /
 * podlaha terasa / zateplenie domčeka / žľab + zvod; jednotkové ceny podľa hárku matros.
 *
 * Plain script (žiadne moduly) — funguje aj cez file:// aj v Node
 * (globalThis.KalkEngine).
 */
(function (global) {
  'use strict';

  // ---------------------------------------------------------------------------
  // Cenník materiálov (hárok matros). `price` = cena bez DPH.
  // `packQty` = veľkosť balenia — jednotková cena položky = price / packQty.
  // `vatPayer` = dodávateľ je platca DPH → nákupná cena s DPH = price × (1+DPH),
  //              inak sa DPH nepripočítava (cena s DPH = cena bez DPH).
  // ---------------------------------------------------------------------------
  var DEFAULT_MATERIALS = [
    { key: 'kvh4060',        name: 'KVH 40/60',            unit: 'm3',    price: 520,    vatPayer: true, supplier: '' },
    { key: 'fosna45120',     name: 'Fošňa 45/120',         unit: 'm3',    price: 452.79, vatPayer: true, supplier: '' },
    { key: 'kvh120120',      name: 'KVH 120/120',          unit: 'm3',    price: 619.65, vatPayer: true, supplier: '' },
    { key: 'latecky1895',    name: 'Latečky 18/95',        unit: 'm3',    price: 627.6,  vatPayer: true, supplier: '' },
    { key: 'stresnaFolia',   name: 'Strešná fólia',        unit: 'm2',    price: 0.64,   vatPayer: true, supplier: 'KJG' },
    { key: 'plechTrapez',    name: 'Plech trapéz',         unit: 'm2',    price: 8.02,   vatPayer: true, supplier: 'KJG' },
    { key: 'osb22',          name: 'OSB doska 22 mm',      unit: 'm2',    price: 5.89,   vatPayer: true, supplier: 'Sezam' },
    { key: 'osb12',          name: 'OSB doska 12 mm',      unit: 'm2',    price: 3.21,   vatPayer: true, supplier: 'Sezam' },
    { key: 'fasadnaFolia',   name: 'Fasádna fólia',        unit: 'm2',    price: 2.88,   vatPayer: true, supplier: 'Jutadach shop' },
    { key: 'nozicky',        name: 'Nožičky na domček',    unit: 'ks',    price: 0.2,    vatPayer: true, supplier: 'Allegro' },
    { key: 'plechZaveterky', name: 'Plech záveterky',      unit: 'bm',    price: 3.2,    vatPayer: true, supplier: 'KJG' },
    { key: 'okno',           name: 'Okno',                 unit: 'ks',    price: 83.33,  vatPayer: true, supplier: 'OBI' },
    { key: 'dvere',          name: 'Dvere',                unit: 'ks',    price: 270,    vatPayer: true, supplier: 'OBI' },
    { key: 'klucka',         name: 'Kľučka',               unit: 'ks',    price: 0,      vatPayer: true, supplier: 'OBI' },
    { key: 'zamok',          name: 'Zámok',                unit: 'ks',    price: 0,      vatPayer: true, supplier: 'OBI' },
    { key: 'kluckaOkno',     name: 'Kľučka okno + krytka', unit: 'ks',    price: 0,      vatPayer: true, supplier: 'OBI' },
    { key: 'klince50',       name: 'Klince 50 mm',         unit: 'ks',    price: 8.05,   packQty: 6000, vatPayer: true, supplier: 'Extol' },
    { key: 'sroby5x50',      name: 'Šróby 5×50',           unit: 'ks',    price: 6.26,   packQty: 300,  vatPayer: true, supplier: 'TK Progres' },
    { key: 'sroby5x90',      name: 'Šróby 5×90',           unit: 'ks',    price: 6.84,   packQty: 200,  vatPayer: true, supplier: 'TK Progres' },
    { key: 'sroby6x160',     name: 'Šróby 6×160',          unit: 'ks',    price: 11.2,   packQty: 100,  vatPayer: true, supplier: 'TK Progres' },
    { key: 'sroby6x140',     name: 'Šróby 6×140',          unit: 'ks',    price: 8.57,   packQty: 100,  vatPayer: true, supplier: 'TK Progres' },
    { key: 'farba',          name: 'Farba',                unit: 'liter', price: 8.93,   vatPayer: true, supplier: 'U maliara' },
    { key: 'tatranProfil',   name: 'Tatranský profil',     unit: 'm2',    price: 10,     vatPayer: true, supplier: '' },
    { key: 'kotvenieStlpov', name: 'Kotvenie stĺpov',      unit: 'ks',    price: 6.25,   vatPayer: true, supplier: 'TK Progres' },
    { key: 'zlab',           name: 'Žľab',                 unit: 'm',     price: 4.24,   vatPayer: true, supplier: 'KJG' },
    { key: 'zlabovyHak',     name: 'Žľabový hák',          unit: 'ks',    price: 2.38,   vatPayer: true, supplier: 'KJG' },
    { key: 'zlaboveCelo',    name: 'Žľabové čelo',         unit: 'ks',    price: 1.86,   vatPayer: true, supplier: 'KJG' },
    { key: 'zlabovyKotlik',  name: 'Žľabový kotlík',       unit: 'ks',    price: 4.62,   vatPayer: true, supplier: 'KJG' },
    { key: 'zvod80',         name: 'Zvod 80 mm',           unit: 'm',     price: 5.04,   vatPayer: true, supplier: 'KJG' },
    { key: 'zvodKolienko90', name: 'Zvod kolienko 90°',    unit: 'ks',    price: 3.85,   vatPayer: true, supplier: 'KJG' },
    { key: 'vata50',         name: 'Vata 50 mm',           unit: 'm2',    price: 2.5,    vatPayer: true, supplier: 'Profistavebniny' },
    { key: 'vata120',        name: 'Vata 120 mm',          unit: 'm2',    price: 5,      vatPayer: true, supplier: 'Profistavebniny' },
    { key: 'rohovaLista',    name: 'Rohová lišta',         unit: 'bm',    price: 1.25,   vatPayer: true, supplier: 'Merkury' },
  ];

  var DEFAULT_SETTINGS = {
    dph: 0.23,               // sadzba DPH (matros N2 = 1,23)
    sadzbaPraceM2: 13.84,    // kalkulacka I4 — výroba € / m²
    doprava: 200,            // kalkulacka E45–E49
    // montáž = základ podľa variantu + príplatky podľa plochy (šírka × hĺbka)
    montazZaklad: { v1: 300, v2: 400, v3: 400, v4: 450, v5: 350 },
    montazPriplatokNad10m2: 100,
    montazPriplatokNad5m2: 50,
    // veľkostný príplatok v predajnej cene, keď šírka aj hĺbka ≥ limit.
    // (V Exceli sekcia „s DPH" používa B2≥4 ∧ B3≥4; sekcia „bez DPH" má chybný
    //  odkaz B17/B18, ktorý bol vždy pravdivý — tu je zámer: rozmerová podmienka.)
    priplatokVelkost: { v1: 150, v2: 200, v3: 300, v4: 300, v5: 200 },
    priplatokMinSirka: 4,
    priplatokMinHlbka: 4,
    marzaMaterial: 1.5,      // materiál × 1,5 v predajnej cene
    finalnyKoef: 1.12,       // celá predajná cena × 1,12
    odkvapKoef: 3,           // odkvap: materiál × 3
    odkvapFinalnyKoef: 1.12, // … × 1,12  (kalkulacka I51)
    zateplenieKoef: 2,       // poznámka v Exceli: „rátať x2 do ceny domčeka"
    // Doplnky terasy — predajné ceny bez DPH podľa poznámok v Exceli
    // (kalkulacka!G11–G13): „zabradlie 75e za meter", „plna stena … 90€ m2",
    // „lamelova stena 100€/bm". Pripočítavajú sa k predajnej cene priamo
    // (bez marže ×1,5 a koeficientu ×1,12 — sú to už predajné sadzby).
    terasaZabradlieBm: 75,
    terasaPlnaStenaM2: 90,
    terasaLamelovaBm: 100,
    // Každé okno navyše (nad základné 1 v cene) — predajná cena S DPH za kus.
    oknoNavyseSDph: 275,
  };

  var DEFAULT_INPUTS = {
    sirka: 4,          // m (kalkulacka B2)
    hlbka: 2.5,        // m (kalkulacka B3)
    vyskaZadu: 2.1,    // m (kalkulacka B5); výška vpredu = vzadu + hĺbka×5 %
    plochaOkna: 0.6,   // m² (kalkulacka B6)
    plochaDveri: 2,    // m² (kalkulacka B7)
    sirkaAltanku: 0,   // m (kalkulacka B8) — šírka terasy/prístrešku
    odkvap: true,
    zateplenie: 'none', // 'none' | 'osb' | 'tatran'
  };

  var VARIANTS = [
    { key: 'v1', label: 'Domček' },
    { key: 'v2', label: 'Domček + terasa' },
    { key: 'v3', label: 'Domček + terasa + podlaha domček' },
    { key: 'v4', label: 'Domček + terasa + podlaha domček aj terasa' },
    { key: 'v5', label: 'Domček + podlaha domček' },
  ];

  function defaultConfig() {
    return JSON.parse(JSON.stringify({ settings: DEFAULT_SETTINGS, materials: DEFAULT_MATERIALS }));
  }

  // ---------------------------------------------------------------------------
  // Pomocné funkcie
  // ---------------------------------------------------------------------------

  // konečné číslo alebo 0 (chráni pred NaN aj Infinity vo vstupoch a configu)
  function fin(x) {
    var n = Number(x);
    return isFinite(n) ? n : 0;
  }
  function max0(x) { return x > 0 ? x : 0; }

  // náhrada za materiál, ktorý v cenníku chýba — výpočet nespadne, položka je za 0
  var MISSING_MAT = { key: 'chyba', name: 'Materiál chýba v cenníku', unit: '', price: 0, vatPayer: false };

  function matMap(config) {
    var m = {};
    (config.materials || []).forEach(function (it) { if (it && it.key) m[it.key] = it; });
    return m;
  }

  // Jednotková cena bez DPH (pri baleniach cena za kus z balenia).
  function unitPrice(mat) {
    mat = mat || MISSING_MAT;
    var q = fin(mat.packQty) > 0 ? fin(mat.packQty) : 1;
    return fin(mat.price) / q;
  }

  function vatFactor(mat, dph) {
    return mat.vatPayer ? 1 + fin(dph) : 1;
  }

  // Položka rozpisu: množstvo × jednotková cena (bez DPH aj s DPH nákupnou).
  function line(mat, qty, dph, noteOrOpts) {
    mat = mat || MISSING_MAT;
    var opts = typeof noteOrOpts === 'string' ? { note: noteOrOpts } : (noteOrOpts || {});
    var up = opts.unitPriceOverride != null ? opts.unitPriceOverride : unitPrice(mat);
    var totalNoVat = qty * up * (opts.priceKoef != null ? opts.priceKoef : 1);
    return {
      key: mat.key,
      name: opts.label || mat.name,
      qty: qty,
      unit: opts.unit || mat.unit,
      unitPrice: up,
      totalNoVat: totalNoVat,
      totalWithVat: totalNoVat * vatFactor(mat, dph),
      note: opts.note || '',
    };
  }

  function sumNoVat(lines) {
    return lines.reduce(function (s, l) { return s + l.totalNoVat; }, 0);
  }
  function sumWithVat(lines) {
    return lines.reduce(function (s, l) { return s + l.totalWithVat; }, 0);
  }

  // ---------------------------------------------------------------------------
  // Odvodené rozmery (kalkulacka B4, B11–B15)
  // ---------------------------------------------------------------------------
  function derive(inputs) {
    inputs = inputs || {};
    var s = fin(inputs.sirka);
    var h = fin(inputs.hlbka);
    var vz = fin(inputs.vyskaZadu);
    var vp = vz + (h * 5) / 100; // spád strechy 5 cm na meter hĺbky
    var okno = fin(inputs.plochaOkna);
    var dvere = fin(inputs.plochaDveri);
    var alt = fin(inputs.sirkaAltanku);
    return {
      sirka: s, hlbka: h, vyskaZadu: vz, vyskaPredu: vp,
      plochaOkna: okno, plochaDveri: dvere, sirkaAltanku: alt,
      prednaStena: s * vp - (okno + dvere),
      bocneSteny: ((vp + vz) / 2) * h * 2,
      zadnaStena: s * vz,
      strecha: s * h,
      pristresok: alt * h,
    };
  }

  // ---------------------------------------------------------------------------
  // Rozpisy materiálu (BOM) — vzorce 1:1 z hárkov Excelu, stĺpec „cena bez dph".
  // `clampNegativeQty` (default true) ošetruje degenerované záporné množstvá
  // (v Exceli terasa!C3 pri šírke altánku < 0,5 m vychádza záporne).
  // ---------------------------------------------------------------------------

  function bomDomcek(d, config, opt) {
    var m = matMap(config);
    var dph = fin((config.settings || {}).dph);
    var steny = d.prednaStena + d.bocneSteny + d.zadnaStena;
    var stenyStrecha = steny + d.strecha;
    var lateckyKs = ((d.sirka * 2 + d.hlbka * 2) * 15 + 25);
    var lines = [
      line(m.kvh4060, ((d.hlbka * 14) + (7 * d.sirka) + (8.667 * d.sirka)) * 0.04 * 0.06 * 1.1, dph),
      // v Exceli ocenené sadzbou fošne 45/120 (domček!D3 → matros!C3)
      line(m.fosna45120, 3.2 * ((d.sirka + 0.12) * (d.hlbka + 0.12)) * 0.05 * 0.12 * 1.1, dph,
        { label: 'KVH 120/120', note: 'cena sadzbou fošňa 45/120' }),
      line(m.stresnaFolia, ((d.sirka + 0.2) * (d.hlbka + 0.2)) * 1.1, dph),
      line(m.plechTrapez, (d.sirka * d.hlbka) * 1.1, dph),
      line(m.plechZaveterky, d.vyskaPredu * 2 + d.vyskaZadu * 2, dph, { label: 'Plech rohy', unit: 'bm' }),
      line(m.osb12, stenyStrecha * 1.25, dph),
      line(m.fasadnaFolia, stenyStrecha * 1.1, dph),
      line(m.nozicky, 8, dph),
      line(m.plechZaveterky, (d.sirka + 0.12) * 2 + (d.hlbka + 0.12) * 2, dph),
      line(m.okno, 1, dph),
      line(m.dvere, 1, dph),
      // latečky: kusy → objem dreva (2,5 m × 18 mm × 95 mm na kus) × cena za m³
      line(m.latecky1895, lateckyKs, dph, {
        unit: 'ks', unitPriceOverride: 2.5 * 0.018 * 0.095 * unitPrice(m.latecky1895),
        note: (2.5 * 0.018 * 0.095 * lateckyKs).toFixed(3).replace('.', ',') + ' m3 dreva',
      }),
      line(m.klince50, lateckyKs * 15, dph),
      line(m.sroby5x90, (16 * d.hlbka) + (8 * d.sirka) + (14 * d.sirka) + 32, dph),
      line(m.farba,
        (((d.sirka * d.vyskaZadu * 2) / 6) + ((d.hlbka * d.vyskaPredu * 4) / 6)
          + (((d.sirka * d.vyskaPredu * 2) / 6) - (d.plochaDveri + d.plochaOkna))) * 0.7,
        dph),
    ];
    return clampLines(lines, opt);
  }

  function bomTerasa(d, config, opt) {
    var m = matMap(config);
    var dph = fin((config.settings || {}).dph);
    var alt = d.sirkaAltanku;
    // KVH 45/120: hranoly po 0,5 m mínus jeden + 2 pozdĺžne — v bm, potom na m³
    var kvh45bm = ((((alt / 0.5) - 1) * d.hlbka) + (alt * 2)) * 1.1;
    var lines = [
      line(m.kvh120120, ((d.hlbka + d.vyskaPredu + d.vyskaZadu) * 1.1) * 0.12 * 0.12 * 1.1, dph,
        { label: 'KVH 120/120 (stĺpy + väznica)' }),
      line(m.fosna45120, kvh45bm * 0.045 * 0.12 * 1.1, dph, { label: 'KVH 45/120 (krokvy)' }),
      line(m.tatranProfil, d.hlbka * alt, dph),
      line(m.stresnaFolia, (d.hlbka + 0.2) * (alt + 0.2) * 1.1, dph),
      line(m.plechTrapez, d.hlbka * alt, dph, { priceKoef: 1.1, note: 'cena ×1,1 (prirezanie)' }),
      line(m.plechZaveterky, alt * 2, dph),
      line(m.kotvenieStlpov, 2, dph),
      line(m.farba, ((alt * d.hlbka) * 2) / 6, dph),
      line(m.sroby5x90, alt * 8, dph),
      line(m.sroby6x160, alt * 4 + 4, dph),
    ];
    return clampLines(lines, opt);
  }

  function bomPodlahaDomcek(d, config, opt) {
    var m = matMap(config);
    var dph = fin((config.settings || {}).dph);
    var plocha = (d.sirka + 0.12) * (d.hlbka + 0.12);
    var osbM2 = plocha * 1.2;
    var lines = [
      line(m.fosna45120, 3.2 * plocha * 0.045 * 0.12 * 1.15, dph),
      line(m.osb22, osbM2, dph),
      line(m.sroby5x50, 5.2 * osbM2, dph),
      line(m.sroby5x90, plocha * 4.84, dph),
      line(m.sroby6x160, plocha * 1.82, dph),
      line(m.plechZaveterky, (d.sirka + 0.12) * 2 + (d.hlbka + 0.12) * 2, dph,
        { label: 'Oplechovanie podlahy zvonku' }),
    ];
    return clampLines(lines, opt);
  }

  function bomPodlahaTerasa(d, config, opt) {
    var m = matMap(config);
    var dph = fin((config.settings || {}).dph);
    var alt = d.sirkaAltanku;
    var zaklad = alt * (d.hlbka + 0.12);
    var lines = [
      line(m.fosna45120, zaklad * 3.35 * 0.045 * 0.12, dph),
      // dosky 2,5/100 — v Exceli ocenené sadzbou za m³ ako latečky 18/95
      line(m.latecky1895, zaklad * 0.025 * 1.1, dph, { label: 'Dosky 2,5/100', unit: 'm3' }),
      line(m.sroby5x50, zaklad * 41.55, dph),
      line(m.sroby5x90, zaklad * 5.7, dph),
      line(m.sroby6x160, zaklad * 1.9, dph),
    ];
    return clampLines(lines, opt);
  }

  // Zateplenie: dve varianty záklopu (OSB / tatranský obklad); spoločný základ.
  function bomZateplenie(d, config, variant, opt) {
    var m = matMap(config);
    var dph = fin((config.settings || {}).dph);
    var steny = d.prednaStena + d.bocneSteny + d.zadnaStena;
    var zaklopM2 = steny + d.strecha + d.strecha * 1.1;
    var lines = [
      line(m.vata120, d.strecha * 1.1, dph, { label: 'Vata 120 mm — podlaha' }),
      line(m.vata120, d.strecha * 1.1, dph, { label: 'Vata 120 mm — strecha' }),
      line(m.vata50, steny * 1.1, dph, { label: 'Vata 50 mm — steny' }),
      variant === 'tatran'
        ? line(m.tatranProfil, zaklopM2, dph, { label: 'Záklop tatranským obkladom' })
        : line(m.osb12, zaklopM2, dph, { label: 'Záklop OSB doskou' }),
      line(m.rohovaLista, ((d.sirka * 4) + (4 * d.hlbka)) * 1.1, dph, { label: 'Olištovanie' }),
      line(m.osb12, d.strecha * 1.1, dph, { label: 'OSB doska pod podlahu' }),
    ];
    return clampLines(lines, opt);
  }

  // Odkvapový systém (hárok „žľab + zvod"). Žľab vedie po šírke domčeka
  // + šírke terasy (ak je terasa).
  function bomOdkvap(d, config, maTerasu, opt) {
    var m = matMap(config);
    var dph = fin((config.settings || {}).dph);
    var zlabM = maTerasu ? d.sirka + d.sirkaAltanku : d.sirka;
    var lines = [
      line(m.zlab, zlabM, dph),
      line(m.zvod80, d.vyskaZadu, dph, { label: 'Zvod' }),
      line(m.zlabovyKotlik, 1, dph),
      line(m.zlabovyHak, zlabM, dph),
      line(m.zlaboveCelo, 2, dph),
      line(m.zvodKolienko90, 1, dph),
    ];
    return clampLines(lines, opt);
  }

  function clampLines(lines, opt) {
    var clamp = !opt || opt.clampNegativeQty !== false;
    if (!clamp) return lines;
    return lines.map(function (l) {
      if (l.qty < 0) {
        return Object.assign({}, l, { qty: 0, totalNoVat: 0, totalWithVat: 0, note: (l.note ? l.note + '; ' : '') + 'záporné množstvo → 0' });
      }
      return l;
    });
  }

  // ---------------------------------------------------------------------------
  // Cenotvorba variantov — sekcia „bez DPH" (kalkulacka riadky 44–49)
  // ---------------------------------------------------------------------------

  function priceVariant(variantKey, d, config, boms, opt) {
    var st = config.settings || {};
    var withTerasa = variantKey === 'v2' || variantKey === 'v3' || variantKey === 'v4';
    var withPodlahaD = variantKey === 'v3' || variantKey === 'v4' || variantKey === 'v5';
    var withPodlahaT = variantKey === 'v4';

    var matNoVat = sumNoVat(boms.domcek)
      + (withTerasa ? sumNoVat(boms.terasa) : 0)
      + (withPodlahaD ? sumNoVat(boms.podlahaDomcek) : 0)
      + (withPodlahaT ? sumNoVat(boms.podlahaTerasa) : 0);

    // Zateplenie: poznámka v Exceli „rátať x2 do ceny domčeka" —
    // 2× materiál zateplenia sa pripočíta k materiálu domčeka pred prirážkami.
    var zateplenieNoVat = 0;
    if (opt && opt.zateplenie && opt.zateplenie !== 'none') {
      zateplenieNoVat = sumNoVat(boms.zateplenie) * fin(st.zateplenieKoef);
      matNoVat += zateplenieNoVat;
    }

    // výroba: plocha stien + strecha (+ prístrešok pri terase,
    // + strecha/2 pri podlahe domčeka, + prístrešok znova pri podlahe terasy).
    // Záporné plochy (okno+dvere väčšie než predná stena) sa do práce nerátajú —
    // mimo Excel režimu (opt.clampNegativeQty === false necháva surové hodnoty).
    var rawAreas = !opt || opt.clampNegativeQty !== false ? max0 : function (x) { return x; };
    var vyrobaPlocha = rawAreas(d.prednaStena) + rawAreas(d.bocneSteny) + rawAreas(d.zadnaStena) + rawAreas(d.strecha)
      + (withTerasa ? rawAreas(d.pristresok) : 0)
      + (withPodlahaD ? rawAreas(d.strecha) / 2 : 0)
      + (withPodlahaT ? rawAreas(d.pristresok) : 0);
    var vyroba = vyrobaPlocha * fin(st.sadzbaPraceM2);

    var plocha = d.sirka * d.hlbka;
    var montaz = fin((st.montazZaklad || {})[variantKey])
      + (plocha > 10 ? fin(st.montazPriplatokNad10m2) : 0)
      + (plocha > 5 ? fin(st.montazPriplatokNad5m2) : 0);

    var doprava = fin(st.doprava);

    var bonusApplies = opt && opt.bonusAlways
      ? true
      : (d.sirka >= fin(st.priplatokMinSirka) && d.hlbka >= fin(st.priplatokMinHlbka));
    var priplatok = bonusApplies ? fin((st.priplatokVelkost || {})[variantKey]) : 0;

    var nakladySpolu = matNoVat + vyroba + doprava + montaz; // „cena final bez dph bez marže"
    var predajnaBezDph = (matNoVat * fin(st.marzaMaterial) + vyroba + doprava + montaz + priplatok) * fin(st.finalnyKoef);
    var predajSDph = predajnaBezDph * (1 + fin(st.dph));
    var zisk = predajnaBezDph - nakladySpolu;

    return {
      key: variantKey,
      label: VARIANTS.filter(function (v) { return v.key === variantKey; })[0].label,
      withTerasa: withTerasa,
      withPodlahaDomcek: withPodlahaD,
      withPodlahaTerasa: withPodlahaT,
      materialNoVat: matNoVat,
      zateplenieNoVat: zateplenieNoVat,
      vyrobaPlocha: vyrobaPlocha,
      vyroba: vyroba,
      doprava: doprava,
      montaz: montaz,
      priplatokVelkost: priplatok,
      nakladySpolu: nakladySpolu,
      predajnaBezDph: predajnaBezDph,
      predajSDph: predajSDph,
      zisk: zisk,
      // null = marža nedáva zmysel (nulová/záporná či nečíselná predajná cena)
      marza: isFinite(zisk) && isFinite(predajnaBezDph) && predajnaBezDph > 0 ? zisk / predajnaBezDph : null,
    };
  }

  // Odkvap (kalkulacka B51/I51/J51): materiál × 3 × 1,12 = predajná bez DPH.
  function priceOdkvap(bom, config) {
    var st = config.settings || {};
    var matNoVat = sumNoVat(bom);
    var predajnaBezDph = matNoVat * fin(st.odkvapKoef) * fin(st.odkvapFinalnyKoef);
    return {
      materialNoVat: matNoVat,
      materialWithVat: sumWithVat(bom),
      predajnaBezDph: predajnaBezDph,
      predajSDph: predajnaBezDph * (1 + fin(st.dph)),
    };
  }

  // ---------------------------------------------------------------------------
  // Hlavný výpočet
  // ---------------------------------------------------------------------------
  // opt: { bonusAlways?: bool, clampNegativeQty?: bool }  (na testy / porovnanie s Excelom)
  function compute(inputs, config, opt) {
    opt = opt || {};
    inputs = inputs || {};
    config = config || defaultConfig();
    var d = derive(inputs);
    var boms = {
      domcek: bomDomcek(d, config, opt),
      terasa: bomTerasa(d, config, opt),
      podlahaDomcek: bomPodlahaDomcek(d, config, opt),
      podlahaTerasa: bomPodlahaTerasa(d, config, opt),
      zateplenie: bomZateplenie(d, config, inputs.zateplenie === 'tatran' ? 'tatran' : 'osb', opt),
      // odkvap v oboch režimoch — dĺžka žľabu závisí od toho, či variant má terasu
      odkvapBezTerasy: bomOdkvap(d, config, false, opt),
      odkvapSTerasou: bomOdkvap(d, config, true, opt),
    };
    var variants = {};
    VARIANTS.forEach(function (v) {
      variants[v.key] = priceVariant(v.key, d, config, boms,
        { zateplenie: inputs.zateplenie, bonusAlways: opt.bonusAlways });
    });
    var odkvap = {
      bezTerasy: priceOdkvap(boms.odkvapBezTerasy, config),
      sTerasou: priceOdkvap(boms.odkvapSTerasou, config),
    };

    var componentTotals = {};
    Object.keys(boms).forEach(function (k) {
      componentTotals[k] = { noVat: sumNoVat(boms[k]), withVat: sumWithVat(boms[k]) };
    });

    return {
      derived: d,
      boms: boms,
      componentTotals: componentTotals,
      variants: variants,
      odkvap: odkvap,
    };
  }

  // Doplnky terasy — uzatvorenie strán (zábradlie / priehľadná lamelová /
  // plná stena). `strany` = { predna, zadna, vonkajsia } s hodnotami
  // 'none' | 'zabradlie' | 'lamelova' | 'plna'.
  // Výšky stien: fasáda = svetlá výška (vyskaZadu + 15 cm konštrukcia),
  // mínus lemovanie 18 cm (podľa návrhára).
  function terasaDoplnky(inputs, config, strany) {
    config = config || defaultConfig();
    var st = config.settings || {};
    var d = derive(inputs);
    strany = strany || {};
    var FASC = 0.18;
    var hloF = d.vyskaZadu + 0.15 - FASC;                 // svetlá stena vzadu
    var hhiF = d.vyskaZadu + 0.15 + d.hlbka * 0.05 - FASC; // vpredu
    var items = [];
    function side(key, label, len, hWall) {
      var t = strany[key];
      if (!t || t === 'none' || !(len > 0)) return;
      if (t === 'zabradlie') {
        items.push({ key: key, label: 'Zábradlie — ' + label, qty: len, unit: 'bm',
          rate: fin(st.terasaZabradlieBm), total: len * fin(st.terasaZabradlieBm) });
      } else if (t === 'lamelova') {
        items.push({ key: key, label: 'Priehľadná (lamelová) stena — ' + label, qty: len, unit: 'bm',
          rate: fin(st.terasaLamelovaBm), total: len * fin(st.terasaLamelovaBm) });
      } else if (t === 'plna') {
        var m2 = len * max0(hWall);
        items.push({ key: key, label: 'Plná stena — ' + label, qty: m2, unit: 'm2',
          rate: fin(st.terasaPlnaStenaM2), total: m2 * fin(st.terasaPlnaStenaM2) });
      }
    }
    side('predna', 'predná strana', d.sirkaAltanku, hhiF);
    side('zadna', 'zadná strana', d.sirkaAltanku, hloF);
    side('vonkajsia', 'vonkajšia strana', d.hlbka, (hhiF + hloF) / 2);
    var bez = items.reduce(function (s, i) { return s + i.total; }, 0);
    return { items: items, predajnaBezDph: bez, predajSDph: bez * (1 + fin(st.dph)) };
  }

  // Výber variantu podľa volieb (logika KALKMAKE K2/L2 + rozšírenie o v4).
  function pickVariant(terasa, podlahaDomcek, podlahaTerasa) {
    if (terasa && podlahaDomcek && podlahaTerasa) return 'v4';
    if (terasa && podlahaDomcek) return 'v3';
    if (terasa) return 'v2';
    if (podlahaDomcek) return 'v5';
    return 'v1';
  }

  global.KalkEngine = {
    VARIANTS: VARIANTS,
    DEFAULT_MATERIALS: DEFAULT_MATERIALS,
    DEFAULT_SETTINGS: DEFAULT_SETTINGS,
    DEFAULT_INPUTS: DEFAULT_INPUTS,
    defaultConfig: defaultConfig,
    derive: derive,
    compute: compute,
    pickVariant: pickVariant,
    terasaDoplnky: terasaDoplnky,
    unitPrice: unitPrice,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/*
 * UI kalkulačky — vanilla JS, žiadne závislosti.
 * Stav sa ukladá do localStorage; výpočty robí KalkEngine (engine.js).
 */
(function () {
  'use strict';

  var E = window.KalkEngine;
  var STORAGE_KEY = 'kalkulacka-vyrobne-v1';

  // ---------------------------------------------------------------------------
  // Stav
  // ---------------------------------------------------------------------------

  function freshState() {
    return {
      config: E.defaultConfig(),
      inputs: {
        sirka: 4, hlbka: 2.5, vyskaZadu: 2.1,
        plochaOkna: 0.6, plochaDveri: 2, sirkaAltanku: 2,
        terasa: false, podlahaDomcek: false, podlahaTerasa: false,
        odkvap: true, zateplenie: 'none',
      },
      firma: { nazov: '', adresa: '', ico: '', dic: '', tel: '', email: '' },
      zakaznik: {
        meno: '', email: '', mobil: '', adresa: '',
        osadenie: 'na zámkovú dlažbu (bez podlahy)',
        umiestnenie: 'dvere vľavo, okno vpravo',
        poznamka: '',
      },
      ui: { tab: 'kalk' },
    };
  }

  function loadState() {
    var st = freshState();
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { /* file:// bez localStorage */ }
    if (!raw) return st;
    var saved;
    try { saved = JSON.parse(raw); } catch (e) { return st; }
    if (!saved || typeof saved !== 'object') return st;

    // len skutočné konečné číslo (isFinite by pustilo '' aj true aj [])
    function num(v) { return typeof v === 'number' && isFinite(v) ? v : null; }

    if (saved.config && saved.config.settings) {
      Object.keys(st.config.settings).forEach(function (k) {
        var v = saved.config.settings[k];
        if (v == null) return;
        if (typeof st.config.settings[k] === 'object') {
          if (typeof v !== 'object') return;
          Object.keys(st.config.settings[k]).forEach(function (k2) {
            if (num(v[k2]) != null) st.config.settings[k][k2] = v[k2];
          });
        } else if (num(v) != null) {
          st.config.settings[k] = v;
        }
      });
    }
    if (saved.config && Array.isArray(saved.config.materials)) {
      var byKey = {};
      saved.config.materials.forEach(function (m) { if (m && m.key) byKey[m.key] = m; });
      st.config.materials.forEach(function (m) {
        var s = byKey[m.key];
        if (!s) return;
        if (num(s.price) != null) m.price = s.price;
        if (typeof s.vatPayer === 'boolean') m.vatPayer = s.vatPayer;
        if (typeof s.supplier === 'string') m.supplier = s.supplier;
        if (num(s.packQty) != null && s.packQty > 0) m.packQty = s.packQty;
      });
    }
    ['inputs', 'firma', 'zakaznik', 'ui'].forEach(function (sect) {
      if (!saved[sect] || typeof saved[sect] !== 'object') return;
      Object.keys(st[sect]).forEach(function (k) {
        var v = saved[sect][k];
        if (v == null || typeof v !== typeof st[sect][k]) return;
        if (typeof v === 'number' && !isFinite(v)) return;
        st[sect][k] = v;
      });
    });
    if (['kalk', 'cennik', 'nastavenia', 'ponuka'].indexOf(st.ui.tab) < 0) st.ui.tab = 'kalk';
    return st;
  }

  var state = loadState();

  var saveTimer = null;
  function flushSave() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  function save() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 150);
  }
  // posledná zmena sa nesmie stratiť pri zatvorení stránky
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flushSave();
  });

  // ---------------------------------------------------------------------------
  // Pomocníci
  // ---------------------------------------------------------------------------

  var eurFmt = new Intl.NumberFormat('sk-SK', { style: 'currency', currency: 'EUR' });
  var numFmt = new Intl.NumberFormat('sk-SK', { maximumFractionDigits: 3 });
  var pctFmt = new Intl.NumberFormat('sk-SK', { style: 'percent', maximumFractionDigits: 1 });

  var eurSmallFmt = new Intl.NumberFormat('sk-SK', {
    style: 'currency', currency: 'EUR', minimumFractionDigits: 4, maximumFractionDigits: 4,
  });

  function eur(x) { return eurFmt.format(isFinite(x) ? x : 0); }
  // jednotkové ceny z balení (klince ~0,0013 €/ks) potrebujú viac desatín
  function eurUnit(x) {
    if (isFinite(x) && x !== 0 && Math.abs(x) < 0.1) return eurSmallFmt.format(x);
    return eur(x);
  }
  function qty(x) { return numFmt.format(isFinite(x) ? x : 0); }
  function pct(x) {
    if (x == null || !isFinite(Number(x))) return '—';
    return pctFmt.format(x);
  }
  // hodnota do editovateľného číselného poľa (slovenská desatinná čiarka)
  function fmtNum(x) {
    if (!isFinite(Number(x))) return '0';
    return String(Number(x)).replace('.', ',');
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function getPath(path) {
    return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, state);
  }
  function setPath(path, value) {
    var keys = path.split('.');
    var o = state;
    for (var i = 0; i < keys.length - 1; i++) o = o[keys[i]];
    o[keys[keys.length - 1]] = value;
  }

  function engineInputs() {
    var i = state.inputs;
    return {
      sirka: i.sirka, hlbka: i.hlbka, vyskaZadu: i.vyskaZadu,
      plochaOkna: i.plochaOkna, plochaDveri: i.plochaDveri,
      sirkaAltanku: i.terasa ? i.sirkaAltanku : 0,
      odkvap: i.odkvap, zateplenie: i.zateplenie,
    };
  }

  function selectedVariantKey() {
    var i = state.inputs;
    return E.pickVariant(i.terasa, i.podlahaDomcek, i.terasa && i.podlahaDomcek && i.podlahaTerasa);
  }

  function compute() {
    return E.compute(engineInputs(), state.config);
  }

  // číselný input naviazaný na cestu v stave.
  // type="text" + inputmode="decimal": desatinná čiarka aj bodka fungujú na
  // každej klávesnici a locale (type="number" v Chromiu čiarku ticho zahodí).
  function numField(label, path, opts) {
    opts = opts || {};
    return '<div class="field"><label class="label" for="f-' + path + '">' + esc(label) + '</label>' +
      '<input id="f-' + path + '" type="text" inputmode="decimal" autocomplete="off"' +
      ' data-path="' + path + '" data-type="num"' +
      (opts.min != null ? ' data-min="' + opts.min + '"' : '') +
      ' value="' + fmtNum(getPath(path)) + '">' +
      (opts.hint ? '<span class="hint">' + esc(opts.hint) + '</span>' : '') +
      '</div>';
  }
  function textField(label, path, opts) {
    opts = opts || {};
    return '<div class="field"><label class="label" for="f-' + path + '">' + esc(label) + '</label>' +
      '<input id="f-' + path + '" type="' + (opts.type || 'text') + '" data-path="' + path + '" data-type="str"' +
      ' value="' + esc(getPath(path)) + '"' + (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '') + '>' +
      '</div>';
  }
  function checkField(label, path) {
    return '<label class="check"><input type="checkbox" data-path="' + path + '" data-type="bool"' +
      (getPath(path) ? ' checked' : '') + '> ' + esc(label) + '</label>';
  }

    renderKalkOut();

  function renderKalkDerived() {
    var el = document.getElementById('kalk-derived');
    if (!el) return;
    var d = E.derive(engineInputs());
    el.innerHTML =
      '<h3 class="section">Vypočítané plochy</h3>' +

      '<tr><td>Zastavaná plocha</td><td>' + qty(d.sirka * d.hlbka) + ' m²</td></tr>' +

  function variantBoms(r, vKey) {
    var v = r.variants[vKey];
    var list = [{ label: 'Domček', bom: r.boms.domcek }];
    if (v.withTerasa) list.push({ label: 'Terasa', bom: r.boms.terasa });
    if (v.withPodlahaDomcek) list.push({ label: 'Podlaha v domčeku', bom: r.boms.podlahaDomcek });
    if (v.withPodlahaTerasa) list.push({ label: 'Podlaha terasy', bom: r.boms.podlahaTerasa });
    if (state.inputs.zateplenie !== 'none') {
      list.push({
        label: 'Zateplenie (' + (state.inputs.zateplenie === 'tatran' ? 'tatranský obklad' : 'OSB') + ')',
        bom: r.boms.zateplenie,
      });
    }
    if (state.inputs.odkvap) {
      list.push({ label: 'Odkvapový systém', bom: v.withTerasa ? r.boms.odkvapSTerasou : r.boms.odkvapBezTerasy });
    }
    return list;
  }

  function renderKalkOut() {
    var el = document.getElementById('kalk-out');
    if (!el) return;
    var r = compute();
    var sel = selectedVariantKey();
    var v = r.variants[sel];
    var odk = state.inputs.odkvap ? (v.withTerasa ? r.odkvap.sTerasou : r.odkvap.bezTerasy) : null;
    var spoluBez = v.predajnaBezDph + (odk ? odk.predajnaBezDph : 0);
    var spoluS = v.predajSDph + (odk ? odk.predajSDph : 0);
    var i = state.inputs;
    var warn = i.terasa && !(i.sirkaAltanku > 0);
    var warnOknoDvere = r.derived.prednaStena < 0;
    // porovnávacia tabuľka počíta varianty s terasou vždy so zadanou šírkou
    // terasy (aj keď je checkbox vypnutý) — inak by v2–v4 vychádzali bez nej
    var rT = r;
    if (!i.terasa && i.sirkaAltanku > 0) {
      var fullIn = engineInputs();
      fullIn.sirkaAltanku = Number(i.sirkaAltanku) || 0;
      rT = E.compute(fullIn, state.config);
    }

    var html =
      '<div class="card hero">' +
      '  <div>' +
      '    <h2>' + esc(v.label) + '</h2>' +
      '    <div>' +
      '      <span class="pill">' + qty(i.sirka) + ' × ' + qty(i.hlbka) + ' m</span> ' +
      (i.terasa ? '<span class="pill">terasa ' + qty(i.sirkaAltanku) + ' m</span> ' : '') +
      (odk ? '<span class="pill">odkvap</span> ' : '') +
      (i.zateplenie !== 'none' ? '<span class="pill">zateplenie ' + (i.zateplenie === 'tatran' ? 'tatran' : 'OSB') + '</span> ' : '') +
      (warn ? '<span class="pill warn">zadaj šírku terasy</span> ' : '') +
      (warnOknoDvere ? '<span class="pill warn">okno + dvere presahujú prednú stenu — skontroluj plochy</span>' : '') +
      '    </div>' +
      '    <div class="breakdown">' +
      '      <span class="item"><span>Materiál</span> <b>' + eur(v.materialNoVat) + '</b></span>' +
      '      <span class="item"><span>Výroba (' + qty(v.vyrobaPlocha) + ' m²)</span> <b>' + eur(v.vyroba) + '</b></span>' +
      '      <span class="item"><span>Doprava</span> <b>' + eur(v.doprava) + '</b></span>' +
      '      <span class="item"><span>Montáž</span> <b>' + eur(v.montaz) + '</b></span>' +
      (v.priplatokVelkost > 0 ? '<span class="item"><span>Príplatok veľkosť</span> <b>' + eur(v.priplatokVelkost) + '</b></span>' : '') +
      (odk ? '<span class="item"><span>Odkvap (predaj bez DPH)</span> <b>' + eur(odk.predajnaBezDph) + '</b></span>' : '') +
      '      <span class="item"><span>Zisk</span> <b>' + eur(v.zisk) + '</b></span>' +
      '      <span class="item"><span>Marža</span> <b>' + pct(v.marza) + '</b></span>' +
      '    </div>' +
      '  </div>' +
      '  <div class="price-big">' +
      '    <div class="caption">Spolu pre zákazníka</div>' +
      '    <div class="withvat">' + eur(spoluS) + '</div>' +
      '    <div class="novat">' + eur(spoluBez) + ' bez DPH · DPH ' + pct(state.config.settings.dph) + '</div>' +
      '  </div>' +
      '</div>';

    // porovnanie variantov
    html += '<div class="card"><h3 class="section">Porovnanie variantov (klikni pre výber)</h3><div class="scroll-x">' +
      '<table class="data"><thead><tr>' +
      '<th>Variant</th><th>Materiál</th><th>Výroba</th><th>Doprava</th><th>Montáž</th>' +
      '<th>Náklady spolu</th><th>Predajná bez DPH</th><th>Predaj s DPH</th><th>Zisk</th><th>Marža</th>' +
      '</tr></thead><tbody>';
    E.VARIANTS.forEach(function (vd) {
      var x = rT.variants[vd.key];
      html += '<tr class="clickable' + (vd.key === sel ? ' selected' : '') + '" data-variant="' + vd.key + '"' +

        '<td>' + (vd.key === sel ? '● ' : '') + esc(x.label) + '</td>' +

        '<td>' + eur(x.doprava) + '</td>' +
        '<td>' + eur(x.montaz) + '</td>' +
        '<td>' + eur(x.nakladySpolu) + '</td>' +
        '<td><b>' + eur(x.predajnaBezDph) + '</b></td>' +
        '<td><b>' + eur(x.predajSDph) + '</b></td>' +

    html += '</tbody></table></div>' +

    // rozpis materiálu
    html += '<div><h3 class="section">Rozpis materiálu — nákup (' + esc(v.label) + ')</h3>';

          '<td>' + eurUnit(l.unitPrice) + '</td>' +
          '<td>' + eur(l.totalNoVat) + '</td><td>' + eur(l.totalWithVat) + '</td></tr>';
      }).join('');
      totalNoVat += sBez; totalWithVat += sS;
      html += '<details class="bom"' + (idx === 0 ? ' open' : '') + '><summary><span>' + esc(sec.label) + '</span>' +
        '<span class="sum">' + eur(sBez) + ' bez DPH · ' + eur(sS) + ' s DPH</span></summary>' +
        '<div class="inner scroll-x"><table class="data"><thead><tr>' +
        '<th>Položka</th><th>Množstvo</th><th style="text-align:left">MJ</th><th>Jedn. cena bez DPH</th><th>Spolu bez DPH</th><th>Spolu s DPH</th>' +
        '</tr></thead><tbody>' + rows +
        '<tr class="total"><td>Spolu</td><td></td><td></td><td></td><td>' + eur(sBez) + '</td><td>' + eur(sS) + '</td></tr>' +
        '</tbody></table></div></details>';
    });
    html += '<p class="note" style="margin-top:10px;">Materiál spolu: <b>' + eur(totalNoVat) + '</b> bez DPH · <b>' +
      eur(totalWithVat) + '</b> s DPH (nákupné ceny' +
      (state.inputs.zateplenie !== 'none'
        ? '; zateplenie je v rozpise raz — k materiálu domčeka sa pred maržou pripočítava ×' +
          qty(state.config.settings.zateplenieKoef)
        : '') + ').</p></div>';

    el.innerHTML = html;
  }

  function renderNastavenia() {
    var el = document.getElementById('tab-nastavenia');
    var s = state.config.settings;
    el.innerHTML =
      '<div class="settings-grid">' +

      '<div class="card settings-block">' +
      '<h3 class="section">DPH a sadzby</h3>' +
      '<div class="field"><label class="label" for="f-dph">DPH (%)</label>' +
      '<input id="f-dph" type="text" inputmode="decimal" autocomplete="off" data-special="dph" data-min="0"' +
      ' value="' + fmtNum(Math.round(s.dph * 1000) / 10) + '"></div>' +
      numField('Výroba — sadzba práce (€/m²)', 'config.settings.sadzbaPraceM2', { min: 0 }) +
      numField('Doprava (€)', 'config.settings.doprava', { min: 0 }) +
      '</div>' +

      '<div class="card settings-block">' +
      '<h3 class="section">Montáž — základ podľa variantu (€)</h3>' +
      numField('Domček', 'config.settings.montazZaklad.v1', { min: 0 }) +
      numField('Domček + terasa', 'config.settings.montazZaklad.v2', { min: 0 }) +
      numField('Domček + terasa + podlaha', 'config.settings.montazZaklad.v3', { min: 0 }) +
      numField('Domček + terasa + podlaha domček aj terasa', 'config.settings.montazZaklad.v4', { min: 0 }) +
      numField('Domček + podlaha', 'config.settings.montazZaklad.v5', { min: 0 }) +
      numField('Príplatok pri ploche nad 5 m²', 'config.settings.montazPriplatokNad5m2', { min: 0 }) +
      numField('Príplatok pri ploche nad 10 m²', 'config.settings.montazPriplatokNad10m2', { min: 0 }) +
      '</div>' +

      '<div class="card settings-block">' +
      '<h3 class="section">Príplatok za veľkosť (€)</h3>' +
      '<p class="note">Pripočíta sa do predajnej ceny, keď šírka aj hĺbka dosiahnu limit.</p>' +
      numField('Limit — šírka od (m)', 'config.settings.priplatokMinSirka', { min: 0 }) +
      numField('Limit — hĺbka od (m)', 'config.settings.priplatokMinHlbka', { min: 0 }) +
      numField('Domček', 'config.settings.priplatokVelkost.v1', { min: 0 }) +
      numField('Domček + terasa', 'config.settings.priplatokVelkost.v2', { min: 0 }) +
      numField('Domček + terasa + podlaha', 'config.settings.priplatokVelkost.v3', { min: 0 }) +
      numField('Domček + terasa + podlaha domček aj terasa', 'config.settings.priplatokVelkost.v4', { min: 0 }) +
      numField('Domček + podlaha', 'config.settings.priplatokVelkost.v5', { min: 0 }) +
      '</div>' +

      '<div class="card settings-block">' +
      '<h3 class="section">Koeficienty predajnej ceny</h3>' +
      numField('Marža na materiál (×)', 'config.settings.marzaMaterial', { min: 0, hint: 'materiál × tento koeficient' }) +
      numField('Finálny koeficient (×)', 'config.settings.finalnyKoef', { min: 0, hint: 'celá predajná cena × tento koeficient' }) +
      numField('Odkvap — koeficient materiálu (×)', 'config.settings.odkvapKoef', { min: 0 }) +
      numField('Odkvap — finálny koeficient (×)', 'config.settings.odkvapFinalnyKoef', { min: 0 }) +
      numField('Zateplenie — koeficient k materiálu domčeka (×)', 'config.settings.zateplenieKoef',
        { min: 0, hint: 'poznámka z Excelu „rátať ×2 do ceny domčeka" — pripočíta sa k materiálu pred maržou' }) +
      '</div>' +

      '<div class="card settings-block">' +
      '<h3 class="section">Doplnky — predajné ceny</h3>' +
      '<p class="note">Terasa podľa poznámok v Exceli (bez DPH); používa ich 3D konfigurátor na webe.</p>' +
      numField('Zábradlie (€/bm)', 'config.settings.terasaZabradlieBm', { min: 0 }) +
      numField('Plná stena (€/m²)', 'config.settings.terasaPlnaStenaM2', { min: 0 }) +
      numField('Priehľadná — lamelová stena (€/bm)', 'config.settings.terasaLamelovaBm', { min: 0 }) +
      numField('Okno navyše (€/ks, s DPH)', 'config.settings.oknoNavyseSDph', { min: 0, hint: 'každé okno nad základné 1 v cene' }) +
      '</div>' +

      '<div class="card settings-block">' +
      '<h3 class="section">Údaje firmy (na ponuke)</h3>' +
      textField('Názov firmy', 'firma.nazov') +
      textField('Adresa', 'firma.adresa') +
      textField('IČO', 'firma.ico') +
      textField('DIČ / IČ DPH', 'firma.dic') +
      textField('Telefón', 'firma.tel') +
      textField('E-mail', 'firma.email', { type: 'email' }) +
      '</div>' +

      '<div class="card settings-block">' +
      '<h3 class="section">Záloha nastavení</h3>' +
      '<p class="note">Všetko sa automaticky ukladá v tomto prehliadači. Súbor JSON použite na prenos na iný počítač' +
      ' — obsahuje ceny, nastavenia aj údaje firmy a zákazníka.</p>' +
      '<div class="btn-row">' +
      '<button class="btn" id="btn-export">Exportovať do súboru</button>' +
      '<button class="btn" id="btn-import">Importovať zo súboru</button>' +
      '<input type="file" id="file-import" accept=".json,application/json" hidden>' +
      '<button class="btn danger" id="btn-reset-all">Obnoviť všetko na predvolené</button>' +
      '</div></div>' +

      '</div>' +
      '<p class="note" style="margin-top:14px;">Vzorec predaja (podľa smerodajnej sekcie „bez DPH" v Exceli): ' +
      '<b>predajná bez DPH = (materiál × marža + výroba + doprava + montáž + príplatok) × finálny koeficient</b>; ' +
      '<b>predaj s DPH = predajná bez DPH × (1 + DPH)</b>.</p>';

    document.getElementById('btn-export').addEventListener('click', exportJson);
    document.getElementById('btn-import').addEventListener('click', function () {
      document.getElementById('file-import').click();
    });
    document.getElementById('file-import').addEventListener('change', importJson);
    document.getElementById('btn-reset-all').addEventListener('click', function () {
      if (!confirm('Naozaj zmazať všetky uložené ceny, nastavenia aj údaje a začať odznova?')) return;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
      state = freshState();
      state.ui.tab = 'nastavenia'; // ostaň na aktuálnej záložke
      renderActiveTab();
    });
  }

  function exportJson() {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    var d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = 'kalkulacka-zaloha-' + d.toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function importJson(ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); } catch (e) { /* ignore */ }
        state = loadState();
        state.ui.tab = 'nastavenia';
        save();
        renderActiveTab();
        alert('Nastavenia boli načítané.');
      } catch (e) {
        alert('Súbor sa nepodarilo načítať — nie je to platná záloha kalkulačky.');
      }
    };
    reader.onerror = function () {
      alert('Súbor sa nepodarilo prečítať.');
    };
    reader.onloadend = function () {
      ev.target.value = '';
    };
    reader.readAsText(file);
  }

  // ---------------------------------------------------------------------------
  // Záložka: Cenová ponuka
  // ---------------------------------------------------------------------------

  function renderPonuka() {
    var el = document.getElementById('tab-ponuka');
    var z = state.zakaznik;
    el.innerHTML =
      '<div class="ponuka-grid">' +
      '<div class="ponuka-form">' +
      '<div class="card settings-block">' +
      '<h3 class="section">Zákazník</h3>' +
      textField('Meno a priezvisko', 'zakaznik.meno') +
      textField('E-mail', 'zakaznik.email', { type: 'email' }) +
      textField('Mobil', 'zakaznik.mobil', { type: 'tel' }) +
      textField('Adresa', 'zakaznik.adresa') +
      '<div class="field"><label class="label" for="f-osadenie">Osadenie</label>' +
      '<select id="f-osadenie" data-path="zakaznik.osadenie" data-type="str">' +
      ['na zámkovú dlažbu (bez podlahy)', 'na betónové pätky (s podlahou)', 'na zemné vruty (s podlahou)'].map(function (o) {
        return '<option' + (z.osadenie === o ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join('') +
      '</select><span class="hint">pätky a vruty sa dodávajú s podlahou — zaškrtni „Podlaha v domčeku" v Kalkulácii</span></div>' +
      textField('Umiestnenie okna a dverí', 'zakaznik.umiestnenie', { placeholder: 'napr. dvere vľavo, okno vpravo' }) +
      '<div class="field"><label class="label" for="f-pozn">Poznámka na ponuke</label>' +
      '<textarea id="f-pozn" rows="3" data-path="zakaznik.poznamka" data-type="str">' + esc(z.poznamka) + '</textarea></div>' +
      '<div class="btn-row no-print" style="margin-top:6px;">' +
      '<button class="btn primary" id="btn-print">Vytlačiť / uložiť ako PDF</button>' +
      '</div>' +
      '</div>' +
      '</div>' +
      '<div id="ponuka-doc"></div>' +
      '</div>';
    renderPonukaDoc();
    document.getElementById('btn-print').addEventListener('click', function () {
      renderPonukaDoc();
      window.print();
    });
  }

  function renderPonukaDoc() {
    var el = document.getElementById('ponuka-doc');
    if (!el) return;
    var r = compute();
    var sel = selectedVariantKey();
    var v = r.variants[sel];
    var i = state.inputs;
    var odk = i.odkvap ? (v.withTerasa ? r.odkvap.sTerasou : r.odkvap.bezTerasy) : null;
    var spoluBez = v.predajnaBezDph + (odk ? odk.predajnaBezDph : 0);
    var spoluS = v.predajSDph + (odk ? odk.predajSDph : 0);
    var dph = state.config.settings.dph;
    var f = state.firma;
    var z = state.zakaznik;
    var d = E.derive(engineInputs());
    var dnes = new Date().toLocaleDateString('sk-SK');

    var specRows = [
      ['Rozmer (šírka × hĺbka)', qty(i.sirka) + ' × ' + qty(i.hlbka) + ' m (' + qty(i.sirka * i.hlbka) + ' m²)'],
      ['Výška vzadu / vpredu', qty(i.vyskaZadu) + ' / ' + qty(d.vyskaPredu) + ' m'],
      ['Okno / dvere', qty(i.plochaOkna) + ' m² / ' + qty(i.plochaDveri) + ' m²'],
      ['Umiestnenie okna a dverí', z.umiestnenie || '—'],
      ['Osadenie', z.osadenie],
      ['Terasa', v.withTerasa ? 'áno, šírka ' + qty(i.sirkaAltanku) + ' m' : 'nie'],
      ['Podlaha v domčeku', v.withPodlahaDomcek ? 'áno' : 'nie'],
    ];
    if (v.withTerasa) specRows.push(['Podlaha na terase', v.withPodlahaTerasa ? 'áno' : 'nie']);
    specRows.push(['Zateplenie', i.zateplenie === 'none' ? 'nie' : (i.zateplenie === 'tatran' ? 'áno — tatranský obklad' : 'áno — záklop OSB')]);
    specRows.push(['Odkvapový systém', odk ? 'áno' : 'nie']);

    var priceRows =
      '<tr><td>' + esc(v.label) + (i.zateplenie !== 'none' ? ' vrátane zateplenia' : '') + '</td>' +
      '<td>' + eur(v.predajnaBezDph) + '</td></tr>' +
      (odk ? '<tr><td>Odkvapový systém</td><td>' + eur(odk.predajnaBezDph) + '</td></tr>' : '') +
      '<tr><td>Spolu bez DPH</td><td>' + eur(spoluBez) + '</td></tr>' +
      '<tr><td>DPH ' + pct(dph) + '</td><td>' + eur(spoluS - spoluBez) + '</td></tr>' +
      '<tr class="total"><td>Cena spolu s DPH</td><td>' + eur(spoluS) + '</td></tr>';

    el.innerHTML =
      '<div class="quote-doc">' +
      '<div class="qhead">' +
      '  <div class="firm">' +
      (f.nazov ? '' : '<div class="note no-print">Údaje firmy doplníš v Nastaveniach</div>') +
      [f.nazov && '<b>' + esc(f.nazov) + '</b>']
        .concat([f.adresa, f.ico && 'IČO: ' + f.ico, f.dic && 'DIČ: ' + f.dic, f.tel, f.email].map(function (x) { return x && esc(x); }))
        .filter(Boolean).join('<br>') +
      '  </div>' +
      '  <div><h2>Cenová ponuka</h2><div class="qmeta">Záhradný domček na mieru<br>Dátum: ' + dnes + '</div></div>' +
      '</div>' +
      '<div class="qsection"><span class="label">Zákazník</span>' +
      '  <div>' + [z.meno && '<b>' + esc(z.meno) + '</b>', esc(z.adresa || ''), esc(z.mobil || ''), esc(z.email || '')]
        .filter(Boolean).join('<br>') + (z.meno || z.adresa || z.mobil || z.email ? '' : '—') + '</div>' +
      '</div>' +
      '<div class="qsection"><span class="label">Špecifikácia</span>' +
      '<div class="scroll-x"><table class="data">' +
      specRows.map(function (row) {
        return '<tr><td>' + esc(row[0]) + '</td><td>' + esc(row[1]) + '</td></tr>';
      }).join('') +
      '</table></div></div>' +
      '<div class="qsection"><span class="label">Cena</span>' +
      '<div class="scroll-x"><table class="data">' + priceRows + '</table></div></div>' +
      (z.poznamka ? '<div class="qsection"><span class="label">Poznámka</span><div>' + esc(z.poznamka).replace(/\n/g, '<br>') + '</div></div>' : '') +
      '<div class="qfoot">Ponuka je informatívna a platí 30 dní od dátumu vystavenia. Cena zahŕňa materiál, výrobu, dopravu a montáž.</div>' +
      '</div>';
  }

  // ---------------------------------------------------------------------------
  // Prepínanie záložiek + udalosti
  // ---------------------------------------------------------------------------

  var renderers = { kalk: renderKalk, cennik: renderCennik, nastavenia: renderNastavenia, ponuka: renderPonuka };

  function renderActiveTab() {
    var tab = state.ui.tab;
    if (!Object.prototype.hasOwnProperty.call(renderers, tab)) tab = 'kalk';
    document.querySelectorAll('nav.tabs button').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false');
      b.setAttribute('tabindex', b.dataset.tab === tab ? '0' : '-1');
    });
    document.querySelectorAll('main [role="tabpanel"]').forEach(function (p) {
      p.hidden = p.id !== 'tab-' + tab;
    });
    renderers[tab]();
  }

  var tablist = document.querySelector('nav.tabs');
  tablist.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-tab]');
    if (!btn) return;
    state.ui.tab = btn.dataset.tab;
    save();
    renderActiveTab();
  });
  // klávesová navigácia záložiek šípkami
  tablist.addEventListener('keydown', function (ev) {
    if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    var btns = Array.prototype.slice.call(tablist.querySelectorAll('button[data-tab]'));
    var idx = btns.findIndex(function (b) { return b.getAttribute('aria-selected') === 'true'; });
    if (idx < 0) return;
    var next = (idx + (ev.key === 'ArrowRight' ? 1 : btns.length - 1)) % btns.length;
    state.ui.tab = btns[next].dataset.tab;
    save();
    renderActiveTab();
    btns[next].focus();
    ev.preventDefault();
  });

  // číslo z poľa s clampom na data-min
  function readNum(t) {
    var n = parseNum(t.value);
    if (t.dataset.min !== undefined) {
      var mn = Number(t.dataset.min);
      if (isFinite(mn) && n < mn) n = mn;
    }
    return n;
  }

  // re-render formulára bez straty fokusu (checkbox zobrazuje/skrýva závislé polia)
  function rerenderKalkFormKeepFocus() {
    var ae = document.activeElement;
    var key = ae && ae.dataset ? ae.dataset.path : null;
    renderKalkForm();
    if (key) {
      var el = document.querySelector('#kalk-form [data-path="' + key + '"]');
      if (el) el.focus();
    }
  }

  // spoločné spracovanie zmeny ovládacieho prvku (input aj change udalosti —
  // change je fallback pre selecty/checkboxy v starších prehliadačoch; ak je
  // hodnota už v stave, nič sa nedeje)
  function handleControl(t) {
    // cenník materiálov
    if (t.dataset.mat != null) {
      var m = state.config.materials[Number(t.dataset.mat)];
      if (!m) return;
      if (t.dataset.field === 'price') {
        var p = readNum(t);
        if (m.price === p) return;
        m.price = p;
      } else if (t.dataset.field === 'supplier') {
        if (m.supplier === t.value) return;
        m.supplier = t.value;
      } else if (t.dataset.field === 'vatPayer') {
        if (m.vatPayer === t.checked) return;
        m.vatPayer = t.checked;
      }
      updateMatVatCell(Number(t.dataset.mat));
      save();
      return;
    }

    // DPH v percentách
    if (t.dataset.special === 'dph') {
      var dph = readNum(t) / 100;
      if (state.config.settings.dph === dph) return;
      state.config.settings.dph = dph;
      save();
      return;
    }

    if (!t.dataset.path) return;
    var type = t.dataset.type;
    var val;
    if (type === 'num') val = readNum(t);
    else if (type === 'bool') val = t.checked;
    else val = t.value;
    if (getPath(t.dataset.path) === val) return;
    setPath(t.dataset.path, val);
    save();

    var tab = state.ui.tab;
    if (tab === 'kalk') {
      if (type === 'bool') rerenderKalkFormKeepFocus(); // zobraz/skry závislé polia
      else renderKalkDerived();
      renderKalkOut();
    } else if (tab === 'ponuka') {
      renderPonukaDoc();
    }
  }

  document.querySelector('main').addEventListener('input', function (ev) {
    handleControl(ev.target);
  });
  document.querySelector('main').addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'file') return handleControl(t);
  });

  // klik / Enter / medzerník na riadok variantu → nastav voľby podľa variantu
  function applyVariantRow(tr) {
    var k = tr.dataset.variant;
    var i = state.inputs;
    i.terasa = k === 'v2' || k === 'v3' || k === 'v4';
    i.podlahaDomcek = k === 'v3' || k === 'v4' || k === 'v5';
    i.podlahaTerasa = k === 'v4';
    save();
    renderKalkForm();
    renderKalkOut();
  }
  document.querySelector('main').addEventListener('click', function (ev) {
    var tr = ev.target.closest('tr[data-variant]');
    if (tr) applyVariantRow(tr);
  });
  document.querySelector('main').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var tr = ev.target.closest && ev.target.closest('tr[data-variant]');
    if (!tr) return;
    ev.preventDefault();
    applyVariantRow(tr);
  });

  function parseNum(s) {
    var n = parseFloat(String(s).replace(',', '.'));
    return isFinite(n) ? n : 0;
  }

  // tlač z inej záložky: dočasne prepni na Ponuku a po tlači sa vráť
  var printPrevTab = null;
  window.addEventListener('beforeprint', function () {
    if (state.ui.tab !== 'ponuka') {
      printPrevTab = state.ui.tab;
      state.ui.tab = 'ponuka';
      renderActiveTab();
    }
  });
  window.addEventListener('afterprint', function () {
    if (printPrevTab) {
      state.ui.tab = printPrevTab;
      printPrevTab = null;
      renderActiveTab();
    }
  });

  renderActiveTab();
})();

</script>
</body>
</html>
